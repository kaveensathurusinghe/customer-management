services:
  db:
    image: mariadb:10.6
    container_name: customer-management-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: customer_management
      MARIADB_USER: springuser
      MARIADB_PASSWORD: springpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: customer-management-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=customer_management
      - DB_USERNAME=springuser
      - DB_PASSWORD=springpass
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: customer-management-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
